<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="trace" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.6" fill="#2DD4BF" opacity="0.20"/>
      <path d="M20,20 h26" stroke="#2DD4BF" stroke-width="1" opacity="0.14"/>
      <circle cx="75" cy="75" r="1.6" fill="#2DD4BF" opacity="0.20"/>
      <path d="M75,75 v26" stroke="#2DD4BF" stroke-width="1" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#trace)"/>

  <!-- shared request pill -->
  <rect x="500" y="46" width="200" height="40" rx="20" fill="none" stroke="#5B6A66" stroke-width="1.5"/>
  <text x="600" y="72" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="17" fill="#EEF1EF">GET /</text>
  <path d="M560,86 L400,150" stroke="#5B6A66" stroke-width="1.5" fill="none"/>
  <path d="M640,86 L800,150" stroke="#5B6A66" stroke-width="1.5" fill="none"/>

  <!-- divider -->
  <line x1="600" y1="150" x2="600" y2="560" stroke="#5B6A66" stroke-width="1" stroke-dasharray="3 7" opacity="0.5"/>

  <!-- LEFT: browser window (real content renders) -->
  <g transform="translate(160,150)">
    <rect width="440" height="330" rx="10" fill="#111A2E" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect width="440" height="34" rx="10" fill="#0B1220"/>
    <rect width="440" height="17" y="17" fill="#0B1220"/>
    <circle cx="20" cy="17" r="5" fill="#E8703F"/>
    <circle cx="38" cy="17" r="5" fill="#2DD4BF" opacity="0.6"/>
    <circle cx="56" cy="17" r="5" fill="#5B6A66"/>

    <rect x="28" y="60" width="160" height="16" rx="3" fill="#2DD4BF"/>
    <rect x="28" y="90" width="384" height="8" rx="3" fill="#3A4A57"/>
    <rect x="28" y="106" width="384" height="8" rx="3" fill="#3A4A57"/>
    <rect x="28" y="122" width="260" height="8" rx="3" fill="#3A4A57"/>

    <rect x="28" y="152" width="110" height="76" rx="6" fill="#0D5A4F" opacity="0.5"/>
    <rect x="150" y="152" width="110" height="76" rx="6" fill="#0D5A4F" opacity="0.5"/>
    <rect x="272" y="152" width="140" height="76" rx="6" fill="#0D5A4F" opacity="0.5"/>

    <rect x="28" y="244" width="200" height="8" rx="3" fill="#3A4A57"/>
    <rect x="28" y="260" width="320" height="8" rx="3" fill="#3A4A57"/>

    <path d="M370,270 l10,10 l18,-20" stroke="#2DD4BF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>
  </g>
  <text x="380" y="512" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#EEF1EF">BROWSER</text>
  <text x="380" y="538" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="13" fill="#5B6A66">renders after the runtime boots</text>

  <!-- RIGHT: crawler window (mostly empty) -->
  <g transform="translate(600,150)">
    <rect width="440" height="330" rx="10" fill="#111A2E" stroke="#E8703F" stroke-width="1.5"/>
    <rect width="440" height="34" rx="10" fill="#0B1220"/>
    <rect width="440" height="17" y="17" fill="#0B1220"/>
    <circle cx="20" cy="17" r="5" fill="#E8703F"/>
    <circle cx="38" cy="17" r="5" fill="#2DD4BF" opacity="0.6"/>
    <circle cx="56" cy="17" r="5" fill="#5B6A66"/>

    <rect x="28" y="60" width="160" height="16" rx="3" fill="#3A4A57"/>
    <rect x="28" y="90" width="220" height="8" rx="3" fill="#3A4A57" opacity="0.7"/>

    <circle cx="220" cy="200" r="34" fill="none" stroke="#E8703F" stroke-width="4" stroke-dasharray="10 10"/>
    <text x="220" y="270" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="14" fill="#E8703F">empty</text>
