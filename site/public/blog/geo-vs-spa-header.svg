  <text x="820" y="512" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#EEF1EF">AI CRAWLER</text>
  <text x="820" y="538" text-anchor="middle" font-family="ui-monospace,'SF Mono','Courier New',monospace" font-size="13" fill="#5B6A66">plain GET, no JS runtime</text>
